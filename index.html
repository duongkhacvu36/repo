<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
:root {
  color-scheme: light dark;
}

body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  background: light-dark(#ffffff, #000000);
  color: light-dark(#1a2639, #f0f0f0);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px 10px 20px;
}

.container {
  width: 100%;
  max-width: 900px;
}

.section-title {
  display: none;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
  margin-top: 0;
  background: light-dark(#ffffff, #0a0a0a);
  box-shadow: light-dark(0 2px 8px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.3));
  border-radius: 12px;
  overflow: hidden;
}

th, td {
  padding: 14px 12px;
  border-bottom: 1px solid light-dark(#eaeef2, #1a1a1a);
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

td {
  color: light-dark(#1a2639, #e0e0e0);
}

thead { display: none; }

.empty {
  text-align: center !important;
  vertical-align: middle;
  color: light-dark(#7f8c8d, #666666);
  padding: 40px;
  height: 60px;
  width: 100%;
  display: table-cell;
  font-style: italic;
  background: light-dark(#f9f9f9, #0f0f0f);
}

/* Xóa icon trước tên tệp */
td:first-child::before {
  content: "" !important;
  display: none !important;
}

/* Cột kích thước */
tr td:nth-child(2) {
  text-align: right;
  padding-right: 12px;
  min-width: 80px;
}

/* Cột nút bên phải */
tr td:last-child {
  text-align: right;
  padding-right: 12px;
  width: 140px; /* Fixed width cho cột nút */
}

.action-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  width: 100%;
}

.action-btn {
  flex: 0 0 60px; /* Fixed width 60px */
  text-align: center;
  padding: 8px 0;
  border-radius: 8px;
  background: light-dark(#f0f4f8, #1a1a1a);
  color: light-dark(#0066cc, #66aaff);
  text-decoration: none;
  border: 1px solid light-dark(#d0d9e6, #333333);
  transition: all 0.2s ease;
  font-size: 0.9rem;
  box-sizing: border-box;
  font-weight: 500;
  cursor: pointer;
  display: inline-block;
}

.action-btn:hover {
  background: light-dark(#0066cc, #3388ff);
  color: white;
  border-color: light-dark(#0066cc, #3388ff);
  box-shadow: 0 2px 8px light-dark(rgba(0,102,204,0.3), rgba(51,136,255,0.3));
}

.toggle-btn.active {
  background: light-dark(#0066cc, #3388ff);
  color: white;
  border-color: light-dark(#0066cc, #3388ff);
  box-shadow: 0 2px 8px light-dark(rgba(0,102,204,0.3), rgba(51,136,255,0.3));
}

td:first-child {
  font-weight: 500;
  color: light-dark(#1a2639, #f0f0f0);
  max-width: 400px;
}

#previewPopup {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 100vw;
  height: 100vh;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 1000;
  animation: fadeIn 0.25s ease;
}

#previewContent {
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 90%;
  max-height: 80%;
  overflow: hidden;
  border-radius: 16px;
  background: light-dark(#ffffff, #0a0a0a);
  padding: 16px;
  box-sizing: border-box;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

#previewContent img,
#previewContent video,
#previewContent iframe {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  margin: auto;
  border-radius: 12px;
}

#previewContent pre {
  background: light-dark(#f5f5f5, #1a1a1a);
  color: light-dark(#1a2639, #e0e0e0);
  padding: 20px;
  border-radius: 12px;
  overflow-x: auto;
  white-space: pre;
  font-family: "Consolas", "Monaco", monospace;
  font-size: 0.9rem;
  border: 1px solid light-dark(#eaeef2, #333333);
  max-height: 70vh;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

footer {
  display: none;
}

@media (max-width: 700px) {
  td { padding: 12px 8px; }
  .action-btn { font-size: 0.85rem; flex: 0 0 55px; }
  tr td:last-child { width: 120px; }
}
</style>
</head>

<body>
<main class="container">
  <table id="filesTable">
    <tbody id="filesBody">
      <tr><td colspan="3" class="empty">Đang tải...</td></tr>
    </tbody>
  </table>
</main>

<div id="previewPopup"><div id="previewContent"></div></div>

<script>
function getRepoInfo() {
  const host = window.location.hostname;
  const path = window.location.pathname.split("/").filter(Boolean);
  let owner = host.split(".")[0];
  let repo = path[0] || "";
  return { owner, repo };
}

const { owner, repo } = getRepoInfo();
const branch = "main";
const filesBody = document.getElementById("filesBody");
const cache = {};

async function apiList(path='') {
  if (cache[path]) return cache[path];
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`GitHub API lỗi ${r.status}`);
  const data = await r.json();
  cache[path] = data;
  return data;
}

function rawUrl(path){ return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`; }

function formatBytes(b){
  if(!b) return '-';
  const k=1024, s=['B','KB','MB','GB'];
  const i=Math.floor(Math.log(b)/Math.log(k));
  return (b/Math.pow(k,i)).toFixed(2)+' '+s[i];
}

function renderFiles(list) {
  const files = list.filter(f => f.type !== 'dir');

  filesBody.innerHTML = files.length ? files.map(f => {
    const url = rawUrl(f.path);
    return `
      <tr>
        <td>${f.name}</td>
        <td>${formatBytes(f.size)}</td>
        <td class="action-buttons">
          <a href="${url}" download class="action-btn">Tải</a>
          <button class="action-btn toggle-btn" onclick="togglePreview(this,'${url}','${f.name}')">Xem</button>
        </td>
      </tr>`;
  }).join('') : `<tr><td colspan="3" class="empty">Không có tệp</td></tr>`;
}

async function loadFiles(path='') {
  filesBody.innerHTML='<tr><td colspan="3" class="empty">Đang tải...</td></tr>';
  try {
    const data = await apiList(path);
    renderFiles(Array.isArray(data) ? data : [data]);
  } catch(e) {
    filesBody.innerHTML=`<tr><td colspan="3" class="empty">Lỗi: ${e.message}</td></tr>`;
  }
}

let currentButton = null;
async function togglePreview(btn, url, name) {
  const popup = document.getElementById("previewPopup");
  const content = document.getElementById("previewContent");

  if (btn === currentButton && popup.style.display === "flex") {
    popup.style.display = "none";
    btn.classList.remove("active");
    content.innerHTML = "";
    currentButton = null;
    return;
  }

  if (currentButton) currentButton.classList.remove("active");

  const ext = name.split('.').pop().toLowerCase();
  let html = "";

  if (["jpg","jpeg","png","gif","webp","svg","bmp"].includes(ext)) {
    html = `<img src="${url}" alt="${name}">`;
  } else if (["mp4","webm","avi","mov","mkv"].includes(ext)) {
    html = `<video src="${url}" controls autoplay></video>`;
  } else if (["pdf"].includes(ext)) {
    html = `<iframe src="${url}" width="90%" height="80%" style="border: none;"></iframe>`;
  } else if (["txt","html","htm","php","js","css","json","md","xml","c","cpp","py","sh","bat","ini","log","conf","yml","yaml"].includes(ext)) {
    try {
      const text = await fetch(url).then(r=>r.text());
      html = `<pre>${escapeHtml(text)}</pre>`;
    } catch {
      html = `<iframe src="${url}" width="90%" height="80%"></iframe>`;
    }
  } else {
    html = `<iframe src="${url}" width="90%" height="80%" style="border: none;"></iframe>`;
  }

  content.innerHTML = html;
  popup.style.display = "flex";
  btn.classList.add("active");
  currentButton = btn;

  popup.onclick = e => {
    if (e.target === popup) {
      popup.style.display = "none";
      btn.classList.remove("active");
      content.innerHTML = "";
      currentButton = null;
    }
  };
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[m]));
}

loadFiles();
</script>
</body>
</html>
