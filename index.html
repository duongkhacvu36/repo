<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title></title>

<style>
:root {
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: light-dark(#ffffff, #000000);
  color: light-dark(#1a2639, #f0f0f0);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 100%;
  padding: 0;
}

.section-title {
  display: none;
}

/* ===== BẢNG ===== */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px; /* Kích thước chữ cố định cho mobile */
  margin-top: 0;
  background: light-dark(#ffffff, #0a0a0a);
  border-radius: 0;
  overflow: hidden;
  table-layout: fixed; /* Fixed layout để kiểm soát độ rộng cột */
}

/* Phân bổ độ rộng cột */
thead, tfoot {
  display: none;
}

/* Cột tên file - chiếm phần còn lại */
td:first-child {
  width: auto;
  padding: 14px 0 14px 16px;
  font-weight: 500;
  color: light-dark(#1a2639, #f0f0f0);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-bottom: 1px solid light-dark(#eaeef2, #1a1a1a);
}

/* Cột kích thước - width cố định */
td:nth-child(2) {
  width: 80px;
  min-width: 80px;
  max-width: 80px;
  padding: 14px 0;
  text-align: right;
  color: light-dark(#4a5568, #a0a0a0);
  font-size: 14px;
  white-space: nowrap;
  border-bottom: 1px solid light-dark(#eaeef2, #1a1a1a);
}

/* Cột nút - width cố định */
td:last-child {
  width: 130px;
  min-width: 130px;
  max-width: 130px;
  padding: 10px 16px 10px 0;
  text-align: right;
  border-bottom: 1px solid light-dark(#eaeef2, #1a1a1a);
}

/* Xóa icon trước tên tệp */
td:first-child::before {
  content: "" !important;
  display: none !important;
}

/* Action buttons */
.action-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  width: 100%;
}

.action-btn {
  flex: 0 0 60px;
  text-align: center;
  padding: 8px 0;
  border-radius: 8px;
  background: light-dark(#f0f4f8, #1a1a1a);
  color: light-dark(#0066cc, #66aaff);
  text-decoration: none;
  border: 1px solid light-dark(#d0d9e6, #333333);
  transition: all 0.2s ease;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: inline-block;
  -webkit-tap-highlight-color: transparent;
}

.action-btn:hover {
  background: light-dark(#0066cc, #3388ff);
  color: white;
  border-color: light-dark(#0066cc, #3388ff);
  box-shadow: 0 2px 8px light-dark(rgba(0,102,204,0.3), rgba(51,136,255,0.3));
}

.toggle-btn.active {
  background: light-dark(#0066cc, #3388ff);
  color: white;
  border-color: light-dark(#0066cc, #3388ff);
  box-shadow: 0 2px 8px light-dark(rgba(0,102,204,0.3), rgba(51,136,255,0.3));
}

/* Empty state */
.empty {
  text-align: center !important;
  vertical-align: middle;
  color: light-dark(#7f8c8d, #666666);
  padding: 40px 20px;
  font-style: italic;
  background: light-dark(#f9f9f9, #0f0f0f);
  font-size: 16px;
  width: auto !important;
}

/* Popup */
#previewPopup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

#previewContent {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 95%;
  height: 90%;
  overflow: hidden;
  border-radius: 12px;
  background: light-dark(#ffffff, #0a0a0a);
  padding: 12px;
  box-sizing: border-box;
}

#previewContent img,
#previewContent video,
#previewContent iframe {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  margin: auto;
  border-radius: 8px;
}

#previewContent pre {
  background: light-dark(#f5f5f5, #1a1a1a);
  color: light-dark(#1a2639, #e0e0e0);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: "Consolas", monospace;
  font-size: 14px;
  border: 1px solid light-dark(#eaeef2, #333333);
  max-height: 100%;
  width: 100%;
  margin: 0;
}

footer {
  display: none;
}

/* ===== MOBILE OPTIMIZATION ===== */
@media (max-width: 480px) {
  /* Tăng kích thước chạm */
  td {
    padding-top: 16px !important;
    padding-bottom: 16px !important;
  }
  
  /* Cột tên file */
  td:first-child {
    padding-left: 12px;
    font-size: 15px;
  }
  
  /* Cột kích thước */
  td:nth-child(2) {
    width: 70px;
    min-width: 70px;
    max-width: 70px;
    font-size: 13px;
    padding-right: 0;
  }
  
  /* Cột nút */
  td:last-child {
    width: 120px;
    min-width: 120px;
    max-width: 120px;
    padding-right: 12px;
  }
  
  /* Nút to hơn cho dễ bấm */
  .action-btn {
    flex: 0 0 55px;
    padding: 10px 0;
    font-size: 14px;
    border-radius: 10px;
  }
  
  .action-buttons {
    gap: 6px;
  }
  
  /* Empty state */
  .empty {
    padding: 50px 16px;
    font-size: 15px;
  }
}

/* Màn hình rất nhỏ */
@media (max-width: 360px) {
  td:first-child {
    padding-left: 8px;
    font-size: 14px;
  }
  
  td:nth-child(2) {
    width: 60px;
    min-width: 60px;
    max-width: 60px;
    font-size: 12px;
  }
  
  td:last-child {
    width: 110px;
    min-width: 110px;
    max-width: 110px;
    padding-right: 8px;
  }
  
  .action-btn {
    flex: 0 0 52px;
    padding: 8px 0;
    font-size: 13px;
  }
  
  .action-buttons {
    gap: 4px;
  }
}
</style>
</head>

<body>
<main class="container">
  <table id="filesTable">
    <tbody id="filesBody">
      <tr><td colspan="3" class="empty">Đang tải...</td></tr>
    </tbody>
  </table>
</main>

<div id="previewPopup" onclick="if(event.target===this)this.style.display='none'">
  <div id="previewContent"></div>
</div>

<script>
function getRepoInfo() {
  const host = window.location.hostname;
  const path = window.location.pathname.split("/").filter(Boolean);
  let owner = host.split(".")[0];
  let repo = path[0] || "";
  return { owner, repo };
}

const { owner, repo } = getRepoInfo();
const branch = "main";
const filesBody = document.getElementById("filesBody");
const cache = {};

async function apiList(path='') {
  if (cache[path]) return cache[path];
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`GitHub API lỗi ${r.status}`);
  const data = await r.json();
  cache[path] = data;
  return data;
}

function rawUrl(path){ return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`; }

function formatBytes(b){
  if(!b) return '-';
  const k=1024, s=['B','KB','MB','GB'];
  const i=Math.floor(Math.log(b)/Math.log(k));
  return (b/Math.pow(k,i)).toFixed(2)+' '+s[i];
}

function renderFiles(list) {
  const files = list.filter(f => f.type !== 'dir');

  filesBody.innerHTML = files.length ? files.map(f => {
    const url = rawUrl(f.path);
    return `
      <tr>
        <td>${f.name}</td>
        <td>${formatBytes(f.size)}</td>
        <td class="action-buttons">
          <a href="${url}" download class="action-btn">Tải</a>
          <button class="action-btn toggle-btn" onclick="togglePreview(this,'${url}','${f.name}')">Xem</button>
        </td>
      </tr>`;
  }).join('') : `<tr><td colspan="3" class="empty">Không có tệp</td></tr>`;
}

async function loadFiles(path='') {
  filesBody.innerHTML='<tr><td colspan="3" class="empty">Đang tải...</td></tr>';
  try {
    const data = await apiList(path);
    renderFiles(Array.isArray(data) ? data : [data]);
  } catch(e) {
    filesBody.innerHTML=`<tr><td colspan="3" class="empty">Lỗi: ${e.message}</td></tr>`;
  }
}

let currentButton = null;
async function togglePreview(btn, url, name) {
  const popup = document.getElementById("previewPopup");
  const content = document.getElementById("previewContent");

  if (btn === currentButton && popup.style.display === "flex") {
    popup.style.display = "none";
    btn.classList.remove("active");
    content.innerHTML = "";
    currentButton = null;
    return;
  }

  if (currentButton) currentButton.classList.remove("active");

  const ext = name.split('.').pop().toLowerCase();
  let html = "";

  if (["jpg","jpeg","png","gif","webp","svg","bmp"].includes(ext)) {
    html = `<img src="${url}" alt="${name}">`;
  } else if (["mp4","webm","avi","mov","mkv"].includes(ext)) {
    html = `<video src="${url}" controls autoplay></video>`;
  } else if (["pdf"].includes(ext)) {
    html = `<iframe src="${url}" width="100%" height="100%" style="border: none;"></iframe>`;
  } else if (["txt","html","htm","php","js","css","json","md","xml","c","cpp","py","sh","bat","ini","log","conf","yml","yaml"].includes(ext)) {
    try {
      const text = await fetch(url).then(r=>r.text());
      html = `<pre>${escapeHtml(text)}</pre>`;
    } catch {
      html = `<iframe src="${url}" width="100%" height="100%"></iframe>`;
    }
  } else {
    html = `<iframe src="${url}" width="100%" height="100%" style="border: none;"></iframe>`;
  }

  content.innerHTML = html;
  popup.style.display = "flex";
  btn.classList.add("active");
  currentButton = btn;
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[m]));
}

loadFiles();
</script>
</body>
</html>
